<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML 3</title>

    <style>
        body {
            color: darkblue;
        }

        div {
            color: purple;
        }

        h1 {
            color: green;
        }
    </style>
</head>

<body>

    <h1>My Basic HTML Page</h1>

    <div>
        <p>This text is inside a div element.</p>
        <p>I chose purple for the font color of my div.</p>
    </div>

    <p>This text uses the body font color.</p>

</body>
</html>
