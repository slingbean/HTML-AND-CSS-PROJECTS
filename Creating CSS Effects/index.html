<!DOCTYPE html>
<html>
    <head>
        <title>Creating Effects with CSS</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="CSS/style.css">
    </head>

    <body>
        <!-- Nav Bar-->
         <nav class="nav-bar">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>

                <li class="drop">
                    <a href="#">Images</a>

                    <div class="rollover-menu">
                        <a href="#image1">Image 1</a>
                        <a href="#image2">Image 2</a>
                        <a href="#image3">Image 3</a>
                    </div>
                </li>
            </ul>
         </nav>

         <!--Images-->

         <section>
            <!--Image 1-->
            <div id="image1" class="image-container">
                <img src="images/japan1.jpg" alt="Japan">
                <div class="overlay"></div>
            </div>
            <!--Image 2-->
            <div id="image2" class="image-container">
                <img src="images/japan2.jpg" alt="Japan" class="zoom">
            </div>
            <!-- Image 3-->
             <div id="image3" class="image-container">
                <div class="circle">
                <img src="images/japan3.jpg" alt="Japan">
                </div>
             </div>
         </section>

         <!--Footer-->
         <footer>
            <div class="footer-text">
                <p>The Tech Academy &copy;</p>
            </div>
         </footer>
    </body>
</html>
